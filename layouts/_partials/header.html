<header class="header">
    <div class="header__inner">
        {{ partial "logo.html" . }}
        <div class="header__right">
            {{ with .Site.Menus.main }}
                {{ partial "menu.html" $ }}
            {{ end }}
            {{- if .Site.Params.EnableThemeToggle }}
                <button class="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">{{ partial "theme-toggle-icon.html" . }}</button>
            {{- end }}
        </div>
    </div>
</header>
